
version: 0.0
os: linux

files:
  - source: 02-codedeploy-ec2/index.html
    destination: /var/www/html/

hooks:
  BeforeInstall:
    - location: 02-codedeploy-ec2/scripts/before_install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: 02-codedeploy-ec2/scripts/application_start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: 02-codedeploy-ec2/scripts/validate_service.sh
      timeout: 300
      runas: root
